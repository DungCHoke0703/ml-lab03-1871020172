name: Lab 03 Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          python scripts/download_data.py

      - name: Check repository and notebook structure
        run: |
          python tests/check_lab03.py

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute Lab03_NaiveBayes.ipynb \
            --output executed_Lab03_NaiveBayes.ipynb \
            --ExecutePreprocessor.timeout=240

      - name: Run Naive Bayes concept unit tests
        run: |
          python -m pytest -q tests/test_nb_manual.py
